name: Build LineageOS 19.0 Wiko Y60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pulizia e Setup Dipendenze
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev m4 libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Setup Tool Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Esecuzione Buildbot per W-K510 (A64B)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        bash buildbot_unified.sh treble A64B

    - name: Caricamento Immagine Finale (system.img)
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-19.0-W-K510-System
        path: ~/build-output/*.img
